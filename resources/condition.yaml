brokentrust:
  id_: brokentrust
  name: • Broken Trust
  is_unique: true
  limit: 1
  text: Treat friendly ships as allied. Non-enemy ships treat you as allied. While
    performing an attack, before declaring the defender, each allied ship in the attack
    arc that is not stressed gains 1 stress token. After you defend or perform an
    attack, if the defender was dealt at least 1 faceup damage card, or was destroyed,
    remove this condition.
  automations: null
compromisingintel:
  id_: compromisingintel
  name: • Compromising Intel
  is_unique: true
  limit: 1
  text: During the System Phase, if the enemy Vi Moradi is at range 0-3, flip your
    dial faceup. While you defend or perform an attack against the enemy Vi Moradi,
    you cannot spend focus tokens.
  automations: null
decoyed:
  id_: decoyed
  name: • Decoyed
  is_unique: true
  limit: 1
  text: While you defend, each friendly Naboo Handmaiden in the attack arc may spend
    1 evade token to change one of your results to an [Evade] result. If you are a
    Naboo Royal N-1 Starfighter, each friendly Naboo Handmaiden in the attack may
    spend 1 evade token to add 1 [Evade] result instead.
  automations: null
falsefriend:
  id_: falsefriend
  name: • False Friend
  is_unique: true
  limit: 1
  text: |
    During the System Phase, if an enemy ship with the Tal Merrik upgrade is at range 0-2 or an enemy remote is at range 0-2, flip your dial faceup.

    **Action:** Gain 1 deplete token and 1 stress token to discard this condition.
  automations: null
fearfulprey:
  id_: fearfulprey
  name: • Fearful Prey
  is_unique: true
  limit: 1
  text: After you defend against an enemy Fearsome Predator, if you did not spend
    at least 1 green token during the attack, gain 1 strain token.
  automations: null
guarded:
  id_: guarded
  name: • Guarded
  is_unique: true
  limit: 1
  text: While you defend, if you are not in the attacker's [Bullseye Arc], roll 1
    additional defense die for each friendly calculating or evading MagnaGuard Protector
    in the attack arc.
  automations: null
hunted:
  id_: hunted
  name: • Hunted
  is_unique: true
  limit: 1
  text: After you are destroyed, you must choose another friendly ship and assign
    this condition to it, if able.
  automations: null
illshowyouthedarkside:
  id_: illshowyouthedarkside
  name: • I'll Show You the Dark Side
  is_unique: true
  limit: 1
  text: When this card is assigned, if there is no faceup damage card on it, the player
    who assigned it searches the damage deck for 1 Pilot damage card and places it
    faceup on this card. Then shuffle the damage deck. When you would suffer 1 [Critical
    Hit] damage, you are instead dealt the faceup damage card on this card. Then,
    remove this card.
  automations: null
itstheresistance:
  id_: itstheresistance
  name: • It's the Resistance
  is_unique: true
  limit: 1
  text: '**Setup**: Start in reserve. When you deploy, you are placed within range 1 of
    any table edge and beyond range 3 of any enemy ship. At the start of the round,
    if all of the friendly GA-97''s [Charge] are active, you **must** deploy. Then remove
    this card. After the friendly GA-97 is destroyed, you **must** deploy. Then gain 1
    disarm token and remove this card.'
  automations: null
listeningdevice:
  id_: listeningdevice
  name: • Listening Device
  is_unique: true
  limit: 1
  text: During the System Phase, if an enemy ship with the Informant upgrade is at
    range 0-2, flip your dial faceup.
  automations: null
markedforelimination:
  id_: markedforelimination
  name: • Marked for Elimination
  is_unique: true
  limit: 1
  text: While you defend, if the attacker is equipped with Tracking Fob and has a
    lock on you, you cannot spend green tokens.
  automations:
  - WHEN_DEFENDING
  - ATTACKER_HAS_TRACKING_FOB
  - ATTACKER_HAS_LOCK
  - CANNOT_SPEND_GREEN_TKN
mercilesspursuit:
  id_: mercilesspursuit
  name: •• Merciless Pursuit
  is_unique: false
  limit: 2
  text: After you perform an attack, if the defender is equipped with The Child, you
    may acquire a lock on the defender.
  automations: null
optimizedprototype:
  id_: optimizedprototype
  name: • Optimized Prototype
  is_unique: true
  limit: 1
  text: 'While you perform a [Front Arc] primary attack against a ship locked by a
    friendly ship with the Director Krennic upgrade, you may spend 1 [Hit], [Critical
    Hit], or [Focus] result. If you do, choose one: the defender loses 1 shield, or
    the defender flips 1 of its facedown damage cards.'
  automations: null
primedforspeed:
  id_: primedforspeed
  name: ••• Primed for Speed
  is_unique: false
  limit: 3
  text: Add a white [SLAM] action to your action bar. After you perform a [SLAM] action,
    you must suffer 1 [Hit] damage to remove 1 disarm token.
  automations:
  - ADD_WHITE_SLAM_ACTION
  - AFTER_SLAM
  - SUFFER_HIT:1
  - REMOVE_DISARM:1
rattled:
  id_: rattled
  name: • Rattled
  is_unique: true
  limit: 1
  text: |
    After a bomb or mine at range 0-1 detonates, suffer 1 [Critical Hit] damage. Then, remove this card.

    **Action:** If there are no bombs or mines at range 0-1, remove this card.
  automations: null
sickeningmaneuver:
  id_: sickeningmaneuver
  name: • Sickening Maneuver
  is_unique: true
  limit: 1
  text: You can execute red maneuvers even while stressed. After you reveal a bank
    [[Bank Left] or [Bank Right]] or turn [[Turn Left] or [Turn Right]] maneuver,
    you must gain 1 strain and execute the maneuver as a slideslip. After you reveal
    a straight [[Straight]] maneuver, you must execute that maneuver as a red koiogran
    turn [[Koiogran Turn]]. After you execute a maneuver, remove this condition.
  automations: null
suppressivefire:
  id_: suppressivefire
  name: • Suppressive Fire
  is_unique: true
  limit: 1
  text: While you perform an attack against a ship other than Captain Rex, roll 1
    fewer attack die. After Captain Rex defends, remove this card. At the end of the
    Combat phase, if Captain Rex did not perform an attack this phase, remove this
    card. After Captain Rex is destroyed, remove this card.
  automations: null
trialsofthedarksaber:
  id_: trialsofthedarksaber
  name: • Trials of the Darksaber
  is_unique: true
  limit: 1
  text: While you perform an attack at attack range 0-2, you may spend 1 [Critical
    Hit] result. If you do, if the defending ship's player has more scored [Victory]
    than you, they lose 1 scored [Victory]. Place that [Victory] on this card. After
    you defend, if you are destroyed by an enemy ship at attack range 0-2, assign
    the Trials Of The Darksaber condition to the attacker (all [Victory] remain on
    this card). At the end of the game, this ship scores all [Victory] on this card.
  automations: null
youdbettermeanbusiness:
  id_: youdbettermeanbusiness
  name: • You'd Better Mean Business
  is_unique: true
  limit: 1
  text: This condition is assigned facedown. Reveal it after you defend. After you
    defend, you may spend 2 [Charge] from Zam Wesell. If you do, perform a bonus attack
    against the attacker. At the end of the Engagement Phase, if this card is facedown
    and you are in an enemy ship's firing arc, you may reveal this card. If you do,
    Zam Wesell recovers 2 [Charge]. At the start of the System Phase, remove this
    condition.
  automations: null
youshouldthankme:
  id_: youshouldthankme
  name: • You Should Thank Me
  is_unique: true
  limit: 1
  text: This condition is assigned facedown. Reveal it after you defend. After you
    defend, Zam Wesell recovers 1 [Charge]. Then, you may acquire a lock on the attacker.
    At the end of the Engagement Phase, if this card is facedown and you are in an
    enemy's firing arc, you may reveal this card and spend 2 [Charge] from Zam Wesell.
    If you do, you may perform a bonus attack. At the start of the System Phase, remove
    this condition.
  automations: null
