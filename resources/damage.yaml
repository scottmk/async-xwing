blinded_pilot:
  id_: blinded_pilot
  name: Blinded Pilot
  type_: pilot
  text: |
    While you perform an attack, you can modify your dice only by spending [Force] for their default effect.

    **Action**: Repair this card.
  count: 2
  automations: null
