  name: Console Fire
  type_: ship
  text: |
    Before you engage, roll 1 attack die. On a [Hit] result, suffer 1 [Hit] damage.

    **Action**: Repair this card.
  count: 2
  automations:
  - ON_HIT_SUFFER_HIT:1
  - ROLL_ATK_DIE:1
  - REPAIR_ACTION
  - BEFORE_ENGAGE
