name: Linting

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint-ruff-python:
    name: "lint:ruff:python"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: ruff format --check
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.14"
          args: "format --check --diff"
